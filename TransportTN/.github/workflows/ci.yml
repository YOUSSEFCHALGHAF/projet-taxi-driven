name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests)
    runs-on: ubuntu-latest
    env:
      TZ: Africa/Tunis
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_tn_2026
          MYSQL_DATABASE: transporttn
          MYSQL_USER: transporttn
          MYSQL_PASSWORD: transporttn_2026
          TZ: Africa/Tunis
        ports:
          - 3307:3306          # même port que docker-compose.yml : application.yml fonctionne tel quel
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot_tn_2026"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v5

      - name: Créer le schéma et les données de test
        run: |
          for fichier in database/init/*.sql; do
            echo "→ $fichier"
            mysql --host=127.0.0.1 --port=3307 --user=root --password=root_tn_2026 \
                  --default-character-set=utf8mb4 transporttn < "$fichier"
          done

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Tests (mvn verify)
        working-directory: backend
        run: mvn -B verify

      - name: Rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests-backend
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  images:
    name: Images Docker
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLIER: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5

      - name: Nom du registre (en minuscules)
        run: echo "REGISTRE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Connexion à GitHub Container Registry
        if: env.PUBLIER == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: ${{ env.PUBLIER == 'true' }}
          tags: |
            ${{ env.REGISTRE }}/transporttn-backend:latest
            ${{ env.REGISTRE }}/transporttn-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Image frontend (Nginx)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: ${{ env.PUBLIER == 'true' }}
          tags: |
            ${{ env.REGISTRE }}/transporttn-frontend:latest
            ${{ env.REGISTRE }}/transporttn-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend