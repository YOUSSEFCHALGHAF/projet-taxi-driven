# =============================================================
# TransportTN : partie commune aux configurations HTTP et HTTPS
# (incluse dans le bloc "server" de chaque modèle)
# =============================================================

root /usr/share/nginx/html;
index index.html;
client_max_body_size 2m;

# En-têtes de sécurité
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

# Compression des fichiers texte
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml;

# ---------- API REST → Spring Boot ----------
location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
}

# ---------- WebSocket STOMP → Spring Boot ----------
# "Upgrade" et "Connection" transforment la requête HTTP en connexion WebSocket.
location /ws {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;    # connexion longue durée (les battements de cœur la maintiennent ouverte)
    proxy_send_timeout 1h;
}

# ---------- Service worker des notifications : jamais en cache ----------
location = /firebase-messaging-sw.js {
    expires -1;
    try_files $uri =404;
}

# ---------- Fichiers construits par Vite (nom avec empreinte) : cache long ----------
location /assets/ {
    expires 1y;
    access_log off;
    try_files $uri =404;
}

# ---------- Application React : toute autre adresse renvoie index.html (React Router) ----------
location / {
    expires -1;
    try_files $uri $uri/ /index.html;
}