# ============================================
# TransportTN Backend - Configuration
# ============================================

spring.application.name=transporttn-backend
server.port=8082

# --- Base de donnees MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/transporttn?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# "update" en dev, prevoir Flyway/Liquibase en production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- JWT ---
# IMPORTANT: en production, generer une cle secrete forte (min 256 bits) et la stocker
# dans une variable d'environnement, jamais en dur dans le code source.
app.jwt.secret=ChangeMoiEnProductionAvecUneCleSecreteForteEtAleatoireDe256BitsMinimum
app.jwt.expiration-ms=86400000

# --- OTP ---
app.otp.expiration-minutes=5
# En debug-mode, le code OTP est renvoye dans la reponse API (utile pour les tests sans SMS reel).
# A mettre a false en production !
app.otp.debug-mode=true

# --- Firebase (notifications FCM uniquement) ---
app.firebase.enabled=true
app.firebase.credentials-path=firebase-service-account.json

# --- Logging ---
logging.level.com.transporttn=DEBUG
logging.level.org.springframework.security=INFO

# --- Jackson ---
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false
